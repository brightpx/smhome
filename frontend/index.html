<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Smart Home</title>
<link rel="stylesheet" href="/theme.css">
<link rel="manifest" href="/manifest.json">
<style>
body{font-family:system-ui;margin:0;padding:12px 12px 96px;max-width:820px;margin-inline:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#30d158}
.dot{width:8px;height:8px;border-radius:999px;background:#30d158;box-shadow:0 0 8px #30d158}
.staleTag{color:#b6c2d3;font-size:11px}
.flowNums{display:flex;justify-content:space-between;text-align:center;margin:8px 0}
.flowNums .v{font-weight:800;font-size:19px}
.pill{display:inline-block;border-radius:999px;padding:.05rem .5rem;font-size:12px;font-weight:700;border:1px solid}
.on{background:linear-gradient(180deg,rgba(48,209,88,.16),rgba(48,209,88,.07));border-color:rgba(48,209,88,.3);color:#30d158}
.off{background:linear-gradient(180deg,rgba(255,69,58,.16),rgba(255,69,58,.07));border-color:rgba(255,69,58,.3);color:#ff453a}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.logrow{padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.logrow .ltime{color:#b6c2d3;font-size:11px;font-variant-numeric:tabular-nums}
.logrow .lval{float:right;color:#fff;font-weight:700}
.row.dev span:first-child{font-weight:700;font-size:14px}
.gang{padding-left:12px;color:#cbd5e1}
.room{font-size:13px;font-weight:700;margin:12px 0 2px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:30px;vertical-align:bottom;margin:0 4px}
.bars i{width:5px;background:#0a84ff;border-radius:2px;opacity:.85}
.flowline{stroke:#888;stroke-width:2;stroke-dasharray:6 5;animation:dashmove 1s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-11}}
@keyframes drift{50%{transform:translateX(4px);opacity:1}}
.v small{font-size:11px;font-weight:600;opacity:.7}
#devices{display:grid;gap:10px}
.devcard{animation:none}
body:not(.seen) .devcard{animation:rise .45s ease both}
.devcard.dim{opacity:.55}
.devhead{display:flex;align-items:center;gap:8px}
.devicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.devicon.meter{background:rgba(10,132,255,.15);color:#5eb0ff}
.devicon.solar{background:rgba(250,204,21,.15);color:#facc15}
.devicon.sw{background:rgba(48,209,88,.12);color:#30d158}
.devicon.off{background:rgba(255,255,255,.06);color:#8a93a3}
.tgl{width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:#30d158}
.tgl.on i{left:19px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bars i{animation:grow .5s ease both}
@keyframes grow{from{transform:scaleY(0)}}
.bars i{transform-origin:bottom}
@media(min-width:700px){.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}}
@media(min-width:1024px){
body{max-width:1240px;padding:24px 24px 96px}
.topbar{font-size:18px}
.flowNums .v{font-size:30px}
.cols{display:block}
#devices{grid-template-columns:repeat(3,1fr)}
.devcard{font-size:14px}
}
</style>
</head>
<body>
<div class="topbar"><b>Smart Home • My Home</b><span style="display:flex;gap:8px;align-items:center"><span id="live"></span><a href="/apps/2031674305368031282/" target="_blank" rel="noopener" style="font-size:12px;color:#0a84ff;text-decoration:none;border:1px solid rgba(10,132,255,.4);padding:6px 10px;border-radius:10px;min-height:32px;display:inline-flex;align-items:center">เปิด Tuya ↗</a></span></div>
<div id="warn"></div>
<div id="qrbox"></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:20px;overflow:auto" onclick="if(event.target===this)this.style.display='none'"><div class="panel" style="max-width:520px;margin:40px auto"><div style="display:flex;justify-content:space-between;align-items:center"><b id="mTitle">log</b><button onclick="document.getElementById('modal').style.display='none'" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;min-height:40px;padding:0 14px">ปิด</button></div><div id="mBody" class="staleTag">โหลด…</div><div style="margin-top:10px"><a id="mFull" href="#" target="_blank" rel="noopener" style="color:#0a84ff;font-size:13px">เปิด Device Log เต็มใน Tuya →</a></div></div></div>
<div class="cols">
<div class="panel" id="flow"><div class="td-title">Energy flow</div><div id="flow">โหลด…</div></div>
<div class="panel"><div class="td-title" id="devTitle">อุปกรณ์</div><div id="devices">โหลด…</div></div>
</div>
<script src="/app.js?v=7"></script>
<div class="staleTag" style="text-align:center;margin-top:16px">dashboard v7 • <span id="ver">js: loading…</span></div>
</body>
</html>
