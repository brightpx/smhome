<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Smart Home</title>
<link rel="stylesheet" href="/theme.css">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;padding:12px 12px 96px;max-width:820px;margin-inline:auto;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7dff9e;text-shadow:0 0 12px rgba(48,209,88,.6)}
.dot{width:8px;height:8px;border-radius:999px;background:#30d158;box-shadow:0 0 10px #30d158,0 0 20px rgba(48,209,88,.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.staleTag{color:#b6c2d3;font-size:11px}
.flowNums{display:flex;justify-content:space-between;text-align:center;margin:8px 0}
.flowNums .v{font-weight:800;font-size:19px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:.15rem .6rem;font-size:12px;font-weight:700;border:1px solid transparent;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 10px rgba(0,0,0,.35);white-space:nowrap}
.on{background:linear-gradient(180deg,rgba(48,209,88,.38),rgba(48,209,88,.14));border-color:rgba(48,209,88,.55);color:#7dff9e;text-shadow:0 0 12px rgba(48,209,88,.6)}
.off{background:linear-gradient(180deg,rgba(255,69,58,.34),rgba(255,69,58,.12));border-color:rgba(255,69,58,.5);color:#ff8f86;text-shadow:0 0 12px rgba(255,69,58,.5)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.logrow{padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.logrow .ltime{color:#b6c2d3;font-size:11px;font-variant-numeric:tabular-nums}
.logrow .lval{float:right;color:#fff;font-weight:700}
.row.dev span:first-child{font-weight:700;font-size:14px}
.gang{padding-left:12px;color:#cbd5e1}
.room{font-size:13px;font-weight:700;margin:12px 0 2px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:30px;vertical-align:bottom;margin:0 4px}
.bars i{width:5px;background:#0a84ff;border-radius:2px;opacity:.85}
.flowline{stroke:#888;stroke-width:2;stroke-dasharray:6 5;animation:dashmove 1s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-11}}
@keyframes drift{50%{transform:translateX(4px);opacity:1}}
.v small{font-size:11px;font-weight:600;opacity:.7}
#devices{display:grid;gap:10px}
.devcard{animation:none}
body:not(.seen) .devcard{animation:rise .45s ease both}
.devcard.dim{opacity:.55}
.devhead{display:flex;align-items:center;gap:8px}
.devicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;border:1px solid rgba(255,255,255,.14)}
.devicon.meter{background:rgba(10,132,255,.2);color:#7db9ff}
.devicon.solar{background:rgba(250,204,21,.2);color:#ffe066}
.devicon.sw{background:rgba(48,209,88,.2);color:#7dff9e}
.devicon.off{background:rgba(255,255,255,.12);color:#e2e8f0}
.tgl{width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:#30d158;box-shadow:0 0 12px rgba(48,209,88,.55),inset 0 1px 2px rgba(0,0,0,.2)}
.tgl.on i{left:19px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bars i{animation:grow .5s ease both}
@keyframes grow{from{transform:scaleY(0)}}
.bars i{transform-origin:bottom}
@media(min-width:700px){.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}}
@media(min-width:1024px){
body{max-width:1240px;padding:24px 24px 96px}
.topbar{font-size:18px}
.flowNums .v{font-size:30px}
.cols{display:block}
#devices{grid-template-columns:repeat(3,1fr)}
.devcard{font-size:14px}
}
</style>
</head>
<body>
<div class="topbar"><b>Smart Home • My Home</b><span style="display:flex;gap:8px;align-items:center"><span id="live"></span><button id="bellBtn" onclick="togglePush()" title="เปิดแจ้งเตือน" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e2e8f0;border-radius:10px;min-height:32px;padding:0 10px;font-size:14px">🔕</button><a href="/apps/2031674305368031282/" target="_blank" rel="noopener" style="font-size:12px;color:#0a84ff;text-decoration:none;border:1px solid rgba(10,132,255,.4);padding:6px 10px;border-radius:10px;min-height:32px;display:inline-flex;align-items:center">เปิด Tuya ↗</a></span></div>
<div id="warn"></div>
<div id="qrbox"></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:20px;overflow:auto" onclick="if(event.target===this)this.style.display='none'"><div class="panel" style="max-width:520px;margin:40px auto"><div style="display:flex;justify-content:space-between;align-items:center"><b id="mTitle">log</b><button onclick="document.getElementById('modal').style.display='none'" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;min-height:40px;padding:0 14px">ปิด</button></div><div id="mBody" class="staleTag">โหลด…</div><div style="margin-top:10px"><a id="mFull" href="#" target="_blank" rel="noopener" style="color:#0a84ff;font-size:13px">เปิด Device Log เต็มใน Tuya →</a></div></div></div>
<div class="cols">
<div class="panel" id="flow"><div class="td-title">Energy flow</div><div id="flow">โหลด…</div></div>
<div class="panel"><div class="td-title" id="devTitle">อุปกรณ์</div><div style="display:flex;gap:8px;margin-bottom:8px"><button id="tabDev" onclick="showTab('dev')" style="flex:1;background:rgba(10,132,255,.25);border:1px solid rgba(10,132,255,.5);color:#fff;border-radius:10px;min-height:36px">อุปกรณ์</button><button id="tabTl" onclick="showTab('tl')" style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e2e8f0;border-radius:10px;min-height:36px">ไทม์ไลน์</button></div><div id="devices">โหลด…</div><div id="timeline" class="staleTag" style="display:none">โหลด…</div></div>
</div>
<script src="/app.js?v=7"></script>
<div class="staleTag" style="text-align:center;margin-top:16px">dashboard v7 • <span id="ver">js: loading…</span></div>
</body>
</html>
