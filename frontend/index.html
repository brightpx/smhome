<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Smart Home</title>
<link rel="stylesheet" href="/theme.css">
<link rel="manifest" href="/manifest.json">
<style>
body{font-family:system-ui;margin:0;padding:12px 12px 96px;max-width:820px;margin-inline:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#30d158}
.dot{width:8px;height:8px;border-radius:999px;background:#30d158;box-shadow:0 0 8px #30d158}
.staleTag{color:#b6c2d3;font-size:11px}
.flowNums{display:flex;justify-content:space-between;text-align:center;margin:8px 0}
.flowNums .v{font-weight:800;font-size:19px}
.pill{display:inline-block;border-radius:999px;padding:.05rem .5rem;font-size:12px;font-weight:700;border:1px solid}
.on{background:linear-gradient(180deg,rgba(48,209,88,.16),rgba(48,209,88,.07));border-color:rgba(48,209,88,.3);color:#30d158}
.off{background:linear-gradient(180deg,rgba(255,69,58,.16),rgba(255,69,58,.07));border-color:rgba(255,69,58,.3);color:#ff453a}
.row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.room{font-size:13px;font-weight:700;margin:10px 0 2px}
@media(min-width:700px){.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}}
</style>
</head>
<body>
<div class="topbar"><b>Smart Home • My Home</b><span id="live"></span></div>
<div class="cols">
<div class="panel" id="flow"><div class="td-title">Energy flow</div><div id="flow">โหลด…</div></div>
<div class="panel"><div class="td-title" id="devTitle">อุปกรณ์</div><div id="devices">โหลด…</div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
